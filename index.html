<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="德语面试备考">
<meta name="theme-color" content="#185fa5">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23185fa5'/%3E%3Ctext x='50' y='68' font-size='46' text-anchor='middle' fill='white'%3EDE%3C/text%3E%3C/svg%3E">
<title>北京导游考试·德语面试备考站</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>北京导游考试 · 德语面试备考站</h1>
    <p>科目五《导游服务能力》｜机考人机对话｜六景点 + 问答 + 口译</p>
  </header>

  <nav class="tabs" id="tabs"></nav>

  <div class="audiobar">
    <span id="srcBadge" class="srcbadge">🔊 音源检测中…</span>
    <button class="minibtn" id="testAudio">🎧 试听一句</button>
    <button class="minibtn" id="toggleSrc">切换为系统语音</button>
    <span class="hintline" id="srcHint"></span>
  </div>

  <section id="v-home" class="view"></section>
  <section id="v-process" class="view hidden"></section>
  <section id="v-spots" class="view hidden"></section>
  <section id="v-topics" class="view hidden"></section>
  <section id="v-terms" class="view hidden"></section>
  <section id="v-interp" class="view hidden"></section>
  <section id="v-faq" class="view hidden"></section>
  <section id="v-sz" class="view hidden"></section>
  <section id="v-sos" class="view hidden"></section>
  <section id="v-sim" class="view hidden"></section>

  <footer>
    ⭐ 全部德语例句均为 Katja 神经语音预合成音频（联网加载）<br>
    建议在 iPhone Safari 中「添加到主屏幕」，随时练习
  </footer>
</div>

<script src="data-spots.js"></script>
<script src="data-spots-old.js"></script>
<script src="data-topics.js"></script>
<script src="data-terms.js"></script>
<script src="data-drills.js"></script>
<script src="data-shizheng.js"></script>
<script src="app.js"></script>
</body>
</html>
